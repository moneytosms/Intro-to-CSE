<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">CSE Degree for Everyone</title>
  <desc id="d">A friendly beginner guide to computer science, in four parts: starting your CS journey, getting set up, finding your people and tools, and how to actually learn CS.</desc>
  <rect width="1200" height="420" rx="26" fill="#1a1d23"/>
  <g id="title-block" transform="translate(64 64)">
