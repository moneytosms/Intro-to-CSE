    <text y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" fill="#c3c9d4">No-fluff, friendly guide to surviving</text>
    <text y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" fill="#c3c9d4">and thriving in computer science.</text>
    <text y="290" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#ff6b35">$ read part1 &amp;&amp; read part2 &amp;&amp; …</text>
